<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drakentype Preview</title>
    <style>
        :root {
            --preview-bg: #050514;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--preview-bg);
        }

        body {
            display: grid;
            place-items: center;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        }

        .preview-stage {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--preview-bg);
        }

        .preview-shell {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
        }

        .preview-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: var(--preview-bg);
        }
    </style>
</head>
<body>
    <div class="preview-stage">
        <div class="preview-shell" id="previewShell">
            <iframe
                class="preview-frame"
                id="previewFrame"
                src="/webgl/Drakentype/index.html"
                title="Drakentype Preview"
                scrolling="no"
                allowfullscreen
            ></iframe>
        </div>
    </div>

    <script>
        const previewShell = document.getElementById("previewShell");
        const previewFrame = document.getElementById("previewFrame");
        let previewWidth = 1920;
        let previewHeight = 1120;

        function syncPreviewBounds() {
            const frameWindow = previewFrame.contentWindow;
            const frameDocument = previewFrame.contentDocument;

            if (!frameWindow || !frameDocument) return;

            frameDocument.documentElement.style.overflow = "hidden";
            frameDocument.body.style.overflow = "hidden";

            const doc = frameDocument.documentElement;
            const body = frameDocument.body;

            previewWidth = Math.max(
                doc.scrollWidth,
                doc.clientWidth,
                body ? body.scrollWidth : 0,
                body ? body.clientWidth : 0,
                1920
            );

            previewHeight = Math.max(
                doc.scrollHeight,
                doc.clientHeight,
                body ? body.scrollHeight : 0,
                body ? body.clientHeight : 0,
                1080
            );

            previewShell.style.width = `${previewWidth}px`;
            previewShell.style.height = `${previewHeight}px`;
            resizePreviewShell();
        }

        function resizePreviewShell() {
            const availableWidth = window.innerWidth;
            const availableHeight = window.innerHeight;
            const scale = Math.min(
                availableWidth / previewWidth,
                availableHeight / previewHeight
            );

            const offsetX = (availableWidth - previewWidth * scale) / 2;
            const offsetY = (availableHeight - previewHeight * scale) / 2;

            previewShell.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
        }

        previewFrame.addEventListener("load", () => {
            syncPreviewBounds();
            requestAnimationFrame(syncPreviewBounds);
            setTimeout(syncPreviewBounds, 150);
        });

        window.addEventListener("resize", resizePreviewShell);
        resizePreviewShell();
    </script>
</body>
</html>
